name: Health prototype and SQLite schema QA

on:
  pull_request:
    paths:
      - 'prototype/**'
      - 'tests/**'
      - 'db/**'
      - 'playwright.config.mjs'
      - 'playwright.mvp.config.mjs'
      - 'package.json'
      - 'src/**'
      - 'miniapp/**'
      - 'scripts/**'
      - 'wrangler.jsonc'
      - 'wrangler.local.jsonc'
      - 'tsconfig.json'
      - '.github/workflows/prototype-e2e.yml'
  push:
    branches:
      - 'docs/requirements-v0.1'
      - 'feature/mvp-s1-core'
      - 'feature/mvp-s2-identity'
      - 'feature/mvp-s2-browser-qa'
      - 'feature/mvp-s3-auth-boundary'
      - 'feature/mvp-s4-wechat-foundation'
    paths:
      - 'prototype/**'
      - 'tests/**'
      - 'db/**'
      - 'playwright.config.mjs'
      - 'playwright.mvp.config.mjs'
      - 'package.json'
      - 'src/**'
      - 'miniapp/**'
      - 'scripts/**'
      - 'wrangler.jsonc'
      - 'wrangler.local.jsonc'
      - 'tsconfig.json'
      - '.github/workflows/prototype-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify schema using Python stdlib
        run: python3 -m unittest discover -s db/tests -p 'test_*.py' -v

  prototype-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Playwright test runner
        run: npm install --no-audit --no-fund
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: npm run check:js
      - name: Run synthetic prototype browser tests
        run: npm run test:prototype
      - name: Upload failed-test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: health-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7


  mvp-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install test and Worker dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check for MVP API
        run: npm run check:types
      - name: Generate random local demo encryption key
        run: npm run dev:setup
      - name: Apply local D1 migrations
        run: npm run db:migrate:local
      - name: Start local Worker and exercise synthetic API
        run: npm run test:api


  mvp-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install development dependencies
        run: npm install --no-audit --no-fund
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Create synthetic local demo keys
        run: npm run dev:setup
      - name: Migrate disposable local D1
        run: npm run db:migrate:local
      - name: Browser E2E through real local Worker API
        run: npm run test:dev-ui
      - name: Upload failed browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: health-local-mvp-browser
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7


  auth-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install identity security test dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check isolated authentication contracts
        run: npm run check:types
      - name: Validate OIDC configuration policy with negative tests
        run: npm run test:auth-policy
      - name: Ensure default worker denies ALL routes on real HTTP
        run: npm run test:release-guard
      - name: Verify default release Worker can build without synthetic credentials
        run: npm run check:release-bundle
      - name: Assert deploy bundle has no demo identity module
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E 'synthetic-owner-alice-v1|synthetic-owner-bob-v1|health-local-s2|DEMO_AUTH_SECRET_BASE64' .tmp/release-gate-build/; then
            echo 'Demo identity logic leaked into default release bundle!'
            exit 1
          fi
          echo 'Default release bundle contains no demo identities or signing secret references.'


  wechat-mini-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install test runner dependencies
        run: npm install --no-audit --no-fund
      - name: Verify native Mini Program and mock code2Session boundary
        run: npm run test:wechat
      - name: Check all backend auth modules type safety
        run: npm run check:types
      - name: Verify default release bundle still blocks the demo
        run: npm run test:release-guard
